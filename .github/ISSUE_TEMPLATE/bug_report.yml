name: Bug report
description: Report a defect in the solver, a skill, or the benchmark harness
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps + the exact command you ran.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Log path, command output, or a redacted challenge snippet. No real flags / keys.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - core / supervisor / planner
        - agents / skills
        - llm / provider
        - sandbox
        - ctfplatform
        - eval / benchmark
        - docs
    validations:
      required: true
