name: Bug report
description: 报告一个确定性的 bug（附复现步骤）
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 实际发生了什么（可复现的命令/输出）。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 最小复现命令；若是某题，请脱敏题面（不含真 flag）。
      placeholder: |
        1. python run.py --mode mock
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - presolve / 静态分析
        - crypto
        - misc
        - web
        - reverse
        - pwn
        - supervisor / 调度
        - 诚实扫描 / 治理
        - 其他
    validations:
      required: false
