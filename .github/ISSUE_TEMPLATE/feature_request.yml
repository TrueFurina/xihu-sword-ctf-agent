name: Feature request
description: 提议一个新的确定性技能、能力或文档改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个改动针对哪类题型 / 哪类失败？请基于真实观察，不自造需求。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案
      description: 打算怎么改（新 skill / 新路由 / 文档）。是否保持 deterministic-first？
    validations:
      required: true
  - type: dropdown
    id: deterministic
    attributes:
      label: 是否保持确定性优先
      options:
        - "是（优先静态分析/脚本）"
        - "否（必须引入 LLM）"
        - "混合"
    validations:
      required: false
  - type: textarea
    id: verify
    attributes:
      label: 验证方式
      description: 如何证明它有效（真题回归 / 单测 / 离线 demo）？
    validations:
      required: false
