name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout httpx aiohttp fastapi uvicorn pycryptodome gmpy2

      - name: Run offline test gate
        # Default gate: offline, per-case seconds-level, no real attachments/network/token.
        # `slow` tests (real attachment unzip / live LLM / wallclock) are excluded here
        # and run manually before a competition.
        run: pytest -q -m "not slow" --timeout=120
