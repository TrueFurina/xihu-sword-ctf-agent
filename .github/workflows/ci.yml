name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 dropped: ctf_agent/pyproject.toml declares requires-python >= 3.13 and
        # the pinned numpy (2.5.2) itself requires >= 3.12 (no cp311 wheel exists),
        # so the 3.11 leg could only ever fail once the numpy dep was honoured.
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system OCR dependency
        # tests/test_jpeg_png_ocr.py::test_tesseract_locatable and the vision-fallback
        # path in tests/test_presolve_jpeg_vision.py need the tesseract binary on PATH.
        # ubuntu-latest images do not ship it.
        #
        # ⚠️ 这里**刻意不加** continue-on-error：
        #   test_jpeg_png_ocr.py::test_tesseract_locatable 硬断言 tesseract 必须存在
        #   （它的 skip 只加在同文件的 test_xuanhun_signin_ocr_flag 上），
        #   所以「装不上」必须让门禁红。加了 continue-on-error 会掩盖成
        #   「步骤 success 但二进制缺失」，然后在测试阶段炸出更难定位的失败
        #   （实测 2026-10-08 CI #152：1 failed，误导性更强）。
        # timeout-minutes: apt 源故障时（实测 2026-10-08 有 run 挂 50+ 分钟，
        #   而同一时段相邻 run 2 分钟就跑完）快速失败，而不是无限期占住 required check。
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          tesseract --version

      - name: Install dependencies
        # Single source of truth: ctf_agent/requirements.txt.
        # The previous hand-written list drifted from it and was missing numpy/pillow,
        # which skills.misc_grid_resample imports unconditionally - that made pytest
        # abort at collection (2 ImportError) and fail the whole gate.
        # pytest-timeout is a gate-only tool, not a runtime dep, so it is installed separately.
        run: |
          python -m pip install --upgrade pip
          pip install -r ctf_agent/requirements.txt
          pip install pytest-timeout

      - name: Run offline test gate
        # Run inside ctf_agent/ so ctf_agent/pytest.ini is actually loaded
        # (testpaths=tests and the `slow` marker registration). Running from the repo
        # root silently skipped that config, hence the Unknown pytest.mark.slow warnings.
        # Default gate: offline, per-case seconds-level, no real attachments/network/token.
        # `local` additionally excludes tests that need gitignored truth artifacts
        # (REAL_SOLVES_LEDGER.md, real attachments) - see ctf_agent/pytest.ini.
        # `slow` tests (real attachment unzip / live LLM / wallclock) are excluded here
        # and run manually before a competition.
        run: pytest -q -m "not slow and not local" --timeout=120
        working-directory: ctf_agent
