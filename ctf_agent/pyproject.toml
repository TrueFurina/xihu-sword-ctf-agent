[project]
name = "ctf-agent"
version = "0.1.0"
description = "西湖论剑 AI-Agent 自动解 CTF 系统（1主1监架构，解出率优先）"
requires-python = ">=3.13"
dependencies = [
    # 核心异步/HTTP
    "aiohttp>=3.9",
    "httpx>=0.27",
    # Web dashboard
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # 密码学/数学
    "gmpy2>=2.1",
    "pycryptodome>=3.20",
    "sympy>=1.13",
    "numpy>=2.0",
    # 图像处理（misc 隐写/视觉）
    "pillow>=10.0",
    # 数据验证
    "pydantic>=2.0",
    # Pygments（代码高亮/日志）
    "Pygments>=2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
]
# 可选：本地 OCR（tesseract 需系统级安装，未装则视觉兜底走 LLM）
vision = [
    "pytesseract>=0.3.10",
    "pymupdf>=1.24",
]
# 可选：pcap 通道（tools/adapters/pcap_probe.py）。scapy 负责解析与 TCP 重组；
# brotli/zstandard 负责 Content-Encoding: br/zstd 的正文还原 —— 缺任一个都只降级
# 不崩，但现代站点的 flag 常压在 br 正文里，语义上应视为必备。
pcap = [
    "scapy>=2.5",
    "brotli>=1.1",
    "zstandard>=0.22",
]

[tool.setuptools]
packages = [
    "ctf_agent",
    "ctf_agent.llm",
    "ctf_agent.eval",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# ruff_gate（2026-10-12）：落地文档宣称但此前未接线的 lint 门禁。
# 仅拦截 F 类（pyflakes）中与"未定义/未使用符号"相关的 5 个 code，
# 与仓库既有的 # noqa: F401 实践一致；不引入 E/W 风格规则，避免误伤。
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F401", "F811", "F821", "F822", "F841"]
