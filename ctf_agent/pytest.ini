; 西湖论剑 CTF-Agent 测试门禁配置（锐评 A1：测试基线必须可复现）
;
; 默认门禁（setup.sh / CI 用）：pytest -q -m "not slow and not local"
;   —— 全部离线可跑、单用例秒级、不依赖真实附件/网络/token。
; local 用例（依赖本地真值产物）：CI/默认门禁排除，避免依赖 .gitignore 排除的本地文件。
; slow 用例（依赖真实附件解压/LLM 在线/墙钟）：pytest -q -m slow
;   —— 赛前彩排手动跑，不进默认门禁（会挂起/烧 token）。
;
; slow 套件实测口径（2026-10-21，21 条，本机 24 核）：
;   * 全量约 40-70 分钟机器时间。**不要用默认的 20 分钟上限去跑**——
;     那只会停在头两条真实爆破上，看起来像"卡死"，实际是单条要 7-10 分钟。
;   * 单条耗时实测：enigma 全链 598s、mhk2 LLL 434s、presolve-mhk2 364s、
;     presolve-enigma（900s 预算）440s；其余 16 条秒级-十秒级。
;   * 建议：pytest -q -m slow --timeout=900；只想验接线时用 -k 排除
;     "ziphard or mhk2 or enigma"（这四条之外的断言都是秒级）。
;   * presolve 主入口有一条**产品级**限制：core/presolve.py 的确定性预扫墙钟
;     默认 300s（6a6e508d 挂死守卫）。本机 enigma 单路要 598s > 300s，
;     所以 test_presolve_enigma_..._via_main_entry 在默认预算下必失败；
;     跑它要 CTF_AGENT_PRESOLVE_WALLCLOCK=900（同代码同用例即通过）。
;   * 2 条 web_target_wiring 因 10725 附件永久丢失（10-20 数据事故）按设计 skip。
; 覆盖率门禁（2026-10-21 接入）
;   CI 与 scripts/_ci_local.sh 用：
;     pytest -m "not slow and not local" --cov=. --cov-report=json:coverage.json
;   再由 scripts/_gate_coverage.py 判阈值。阈值真源在 pyproject.toml 的
;   [tool.ctf_coverage_gate]，口径是「不许比基线更低」，不是「达到理想值」——
;   理由见 _gate_coverage.py 头部（设一个够不到的目标只会得到一道天天红、
;   然后被整段注释掉的门禁）。
;   不放进 setup.sh：赛前就绪只需回答"能不能跑"，不需要额外 7 分钟采集。
[pytest]
testpaths = tests
markers =
    slow: 依赖真实附件/网络/在线 LLM 的慢用例（默认门禁排除，赛前彩排手动跑）
    local: 依赖 .gitignore 排除的本地真值产物（REAL_SOLVES_LEDGER.md 台账、
        data/questions_real/_attachments/ 真实附件）；CI 上不可能存在，默认门禁排除。
; tmp 目录保留策略（2026-09-19）：本环境的 safe-delete 守卫会拒绝 pytest 会话启动时
; 对旧 tmp 的批量删除（>50 个文件/回合）→ 使 pytest 非零退出，进而让 ⑥/Reviewer/merge
; 门禁"假红"。保留几乎全部 tmp（policy=all + 大 count），pytest 即不再触发该批量删除。
; 等价于命令行 `-o tmp_path_retention_count=100000`，但写成配置即全局生效、无环境变量依赖。
; 注意 policy 合法值为 all/failed/none（非 always）。
tmp_path_retention_count = 100000
tmp_path_retention_policy = all
