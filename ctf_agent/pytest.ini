; 西湖论剑 CTF-Agent 测试门禁配置（锐评 A1：测试基线必须可复现）
;
; 默认门禁（setup.sh / CI 用）：pytest -q -m "not slow and not local"
;   —— 全部离线可跑、单用例秒级、不依赖真实附件/网络/token。
; local 用例（依赖本地真值产物）：CI/默认门禁排除，避免依赖 .gitignore 排除的本地文件。
; slow 用例（依赖真实附件解压/LLM 在线/墙钟）：pytest -q -m slow
;   —— 赛前彩排手动跑，不进默认门禁（会挂起/烧 token）。
[pytest]
testpaths = tests
markers =
    slow: 依赖真实附件/网络/在线 LLM 的慢用例（默认门禁排除，赛前彩排手动跑）
    local: 依赖 .gitignore 排除的本地真值产物（REAL_SOLVES_LEDGER.md 台账、
        data/questions_real/_attachments/ 真实附件）；CI 上不可能存在，默认门禁排除。
; tmp 目录保留策略（2026-09-19）：本环境的 safe-delete 守卫会拒绝 pytest 会话启动时
; 对旧 tmp 的批量删除（>50 个文件/回合）→ 使 pytest 非零退出，进而让 ⑥/Reviewer/merge
; 门禁"假红"。保留几乎全部 tmp（policy=all + 大 count），pytest 即不再触发该批量删除。
; 等价于命令行 `-o tmp_path_retention_count=100000`，但写成配置即全局生效、无环境变量依赖。
; 注意 policy 合法值为 all/failed/none（非 always）。
tmp_path_retention_count = 100000
tmp_path_retention_policy = all
