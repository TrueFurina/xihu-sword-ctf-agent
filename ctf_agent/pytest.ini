; 西湖论剑 CTF-Agent 测试门禁配置（锐评 A1：测试基线必须可复现）
;
; 默认门禁（setup.sh / CI 用）：pytest -q -m "not slow and not local"
;   —— 全部离线可跑、单用例秒级、不依赖真实附件/网络/token。
; slow 用例（依赖真实附件解压/LLM 在线/墙钟）：pytest -q -m slow
;   —— 赛前彩排手动跑，不进默认门禁（会挂起/烧 token）。
[pytest]
testpaths = tests
markers =
    slow: 依赖真实附件/网络/在线 LLM 的慢用例（默认门禁排除，赛前彩排手动跑）
    local: 依赖 .gitignore 排除的本地真值产物（REAL_SOLVES_LEDGER.md 台账、
        data/questions_real/_attachments/ 真实附件）；CI 上不可能存在，默认门禁排除。
